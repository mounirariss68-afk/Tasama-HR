            color:
              kind: token
              token: foreground
          lineHeight: 1.25
          spaceAfterPt: 12
          bullet:
            kind: character
            character: •
  - id: pageNumber
    type: text
    frame:
      x: 1760
      y: 1010
      width: 80
      height: 50
    body:
      paragraphs:
        - runs:
            - text: "9"
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 15
            weight: 400
            color:
              kind: token
              token: foreground
