format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: token
    token: background
theme:
  colors:
    background: "#FEFFFE"
    foreground: "#10069E"
    accent: "#B59D5E"
    surface: "#FEFFFE"
    muted: "#10069E"
    light: "#FEFFFE"
  fonts:
    display: Montserrat
    body: Montserrat
assets:
  image-1:
    src: assets/imported-eadf4bcf-447f-445b-a90d-1e5934aba3c7/image_1.png
  image-4:
    src: assets/imported-eadf4bcf-447f-445b-a90d-1e5934aba3c7/image_4.png
  image-5:
    src: assets/imported-eadf4bcf-447f-445b-a90d-1e5934aba3c7/image_5.png
elements:
  - id: tasamaLogo
    name: Graphic 6
    frame:
      x: 1572
      y: 60.23
      width: 284.69
      height: 59.59
    altText: Graphic 6
    type: image
    assetId: image-1
    fit: contain
  - id: headline
    type: text
    frame:
      x: 80
      y: 60
      width: 1450
      height: 170
    body:
      paragraphs:
        - runs:
            - text: Development is running. Publishing needs seeded data.
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 30
            weight: 600
            color:
              kind: token
              token: foreground
          lineHeight: 1.1
          spaceAfterPt: 0
  - id: headerRule
    type: shape
    frame:
      x: 80
      y: 230
      width: 100
      height: 5
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
  - id: bodyCopy
    type: text
    frame:
      x: 80
      y: 305
      width: 1760
      height: 665
    body:
      paragraphs:
        - runs:
            - text: Development contains all five client accounts and Tasama’s completed seed
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            weight: 400
            color:
              kind: token
              token: foreground
          lineHeight: 1.25
          spaceAfterPt: 12
          bullet:
            kind: character
            character: •
        - runs:
            - text: Latest production build succeeded, but startup exceeded the 60-second
