          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            weight: 400
            color:
              kind: token
              token: foreground
          lineHeight: 1.25
          spaceAfterPt: 12
          bullet:
            kind: character
            character: •
        - runs:
