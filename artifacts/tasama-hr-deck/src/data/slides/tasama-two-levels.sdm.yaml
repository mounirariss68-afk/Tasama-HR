format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: token
    token: background
theme:
  colors:
    background: "#FEFFFE"
    foreground: "#10069E"
    accent: "#B59D5E"
    surface: "#FEFFFE"
    muted: "#10069E"
    light: "#FEFFFE"
  fonts:
    display: Montserrat
    body: Montserrat
assets:
