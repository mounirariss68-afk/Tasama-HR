<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasama HR · Agentic HR Services</title>
    <meta name="description" content="Tasama HR: agentic HR services. Demo prototype on synthetic data." />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem("atelier-theme") || "system";
          var d = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", d);
          document.documentElement.style.colorScheme = d ? "dark" : "light";
          var l = localStorage.getItem("rafeeq-lang");
          if (l === "ar") { document.documentElement.setAttribute("dir", "rtl"); document.documentElement.setAttribute("lang", "ar"); }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
